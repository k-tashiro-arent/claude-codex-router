# ruff's default rules change between versions, so what is checked is fixed here, and the ruff version is pinned in CI.
#
# What is checked:
#   F        pyflakes (things that do real harm, such as unused imports, undefined names and duplicate definitions)
#   E4/E7/E9 import errors, and things that lead directly to syntax or runtime errors
#   W        trailing whitespace and line endings
#   I        import order
[lint]
select = ["E4", "E7", "E9", "F", "W", "I"]
