name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck & bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh bootstrap.sh test/smoke.sh examples/codex-offload/*.sh examples/claude-offload/*.sh
      - name: bash -n syntax check
        run: |
          for f in install.sh uninstall.sh bootstrap.sh test/smoke.sh examples/codex-offload/*.sh examples/claude-offload/*.sh; do
            bash -n "$f"
          done

  # pin the ruff version (unpinned, a change in the default rules alone turns CI red). What is checked is fixed in ruff.toml
  python-lint:
    name: python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: py_compile
        run: python -m py_compile bin/*.py test/*.py
      - name: ruff
        run: |
          python -m pip install --quiet 'ruff==0.16.4'
          ruff check bin/ test/

  # from install to uninstall (fake HOME, codex, usage API, crontab).
  # ubuntu + macOS, both install.sh directly and the curl one-liner path (cloning the local checkout)
  smoke:
    name: smoke (${{ matrix.os }} / ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mode: [direct, bootstrap]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: prepare local ref for bootstrap
        if: matrix.mode == 'bootstrap'
        run: git branch -f citest HEAD
      - name: run smoke test
        env:
          SMOKE_INSTALL_MODE: ${{ matrix.mode }}
          SMOKE_BOOTSTRAP_REF: citest
        run: bash test/smoke.sh

  # macOS still ships bash 3.2 as /bin/bash. The runner has Homebrew bash (5.x) first on PATH,
  # so faults that only happen on 3.2 (an empty "${ARR[@]}" being unbound under set -u) are never hit.
  # Point PATH's bash at the system one before running the smoke test.
  smoke-system-bash:
    name: smoke (macos-latest / system bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: put the system bash first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/sysbash"
          ln -s /bin/bash "$RUNNER_TEMP/sysbash/bash"
          echo "$RUNNER_TEMP/sysbash" >> "$GITHUB_PATH"
      - name: show the bash version in use
        run: |
          command -v bash
          bash --version | head -1
          bash -c 'test "${BASH_VERSINFO[0]}" -eq 3' || { echo "not bash 3.x; this job would not test anything"; exit 1; }
      - name: run smoke test
        env:
          SMOKE_INSTALL_MODE: direct
        run: bash test/smoke.sh
